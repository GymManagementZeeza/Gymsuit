spring.application.name=gymmanagement

spring.datasource.url=jdbc:mysql://10.0.0.37:3306/gymmanagement
spring.datasource.username=athul
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=2592000000

app.google.client-id=798189244460-5soaopacnhgfaf7hj4nelo4s8fmihn6b.apps.googleusercontent.com

app.cors.allowed-origins=https://gymsuit.app,http://gymsuit.app,http://localhost:3000,http://localhost:3001

app.resend.api-key=${RESEND_API_KEY:}
app.resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

app.openrouter.api-key=${OPENROUTER_API_KEY:}
app.openrouter.model=${OPENROUTER_MODEL:google/gemini-2.5-flash}

# RabbitMQ — async workloads (OTP/notification emails, member notifications, activity feed).
# Queues are durable with dead-lettering; consumers scale via listener concurrency below.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Consumer scaling: start with 2 consumers per queue, scale to 8 under load, 20 msgs prefetched each.
app.rabbitmq.listener.concurrency=${RABBITMQ_LISTENER_CONCURRENCY:2}
app.rabbitmq.listener.max-concurrency=${RABBITMQ_LISTENER_MAX_CONCURRENCY:8}
app.rabbitmq.listener.prefetch=${RABBITMQ_LISTENER_PREFETCH:20}

# Retry: 3 attempts with exponential backoff (2s -> 15s max) before dead-lettering.
app.rabbitmq.listener.retry.max-attempts=${RABBITMQ_RETRY_MAX_ATTEMPTS:3}
app.rabbitmq.listener.retry.initial-interval-ms=${RABBITMQ_RETRY_INITIAL_INTERVAL_MS:2000}
app.rabbitmq.listener.retry.max-interval-ms=${RABBITMQ_RETRY_MAX_INTERVAL_MS:15000}

# Redis — Spring Cache backend for read-heavy data (gym profiles, membership plans,
# activity feed). A Redis outage degrades to the database instead of failing requests.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:5s}

# Per-cache TTLs (ISO-8601 durations).
app.cache.gyms-ttl=${CACHE_GYMS_TTL:PT30M}
app.cache.membership-plans-ttl=${CACHE_MEMBERSHIP_PLANS_TTL:PT15M}
app.cache.activities-ttl=${CACHE_ACTIVITIES_TTL:PT60S}

# MinIO (S3-compatible object storage) — gym logos and uploads. Files land under the
# bucket's public/ prefix and are served straight off MinIO, never proxied by the API.
app.storage.endpoint=${S3_ENDPOINT:http://localhost:9000}
app.storage.region=${S3_REGION:us-east-1}
app.storage.bucket=${S3_BUCKET:gymsuit-uploads}
app.storage.access-key=${S3_ACCESS_KEY:gymsuit}
app.storage.secret-key=${S3_SECRET_KEY:gymsuit-minio-secret}
app.storage.public-url=${S3_PUBLIC_URL:http://localhost:9000}
app.storage.max-upload-mb=${S3_MAX_UPLOAD_MB:5}

