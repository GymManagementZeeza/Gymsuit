services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: gymmanagement-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-gymsuit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-gymsuit}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: gymmanagement-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # Stateless API: run N copies behind nginx with `docker compose up --scale backend=3 -d`.
  # (No container_name / host ports here — those would collide between replicas.)
  backend:
    build:
      context: ./backend/gymmanagement
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://10.0.0.37:3306/gymmanagement}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-athul}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_JWT_EXPIRATION_MS: ${APP_JWT_EXPIRATION_MS:-86400000}
      APP_GOOGLE_CLIENT_ID: ${APP_GOOGLE_CLIENT_ID}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-gymsuit}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-gymsuit}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-gymsuit-uploads}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-gymsuit}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-gymsuit-minio-secret}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000}

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.gymsuit.app}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${APP_GOOGLE_CLIENT_ID}
    restart: unless-stopped
    depends_on:
      - backend

  # Single entrypoint: nginx routes /api/* to the backend pool, everything else to the frontend.
  nginx:
    image: nginx:1.27-alpine
    container_name: gymmanagement-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

  # S3-compatible object storage (gym logos, uploads). Console on :9001.
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: gymmanagement-minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gymsuit}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gymsuit-minio-secret}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5

  # One-shot: creates the uploads bucket and makes the public/ prefix world-readable.
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gymsuit}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gymsuit-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-gymsuit-uploads}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing local/$$S3_BUCKET &&
        mc anonymous set download local/$$S3_BUCKET/public/ ;
        exit 0
      "
    restart: "no"

volumes:
  rabbitmq-data:
  redis-data:
  minio-data:
