name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships an Android SDK (cmdline-tools,
      # platform-tools, build-tools, recent platforms) with ANDROID_HOME
      # set. android-actions/setup-android is intentionally NOT used:
      # its defaults break on current runners (it tries to install the
      # long-removed `tools` package, and its license step prompts
      # interactively instead of accepting non-interactively).
      - name: Accept Android SDK licenses and install packages
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: GymSuitApp
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gymsuit-debug-apk
          path: GymSuitApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
