# GymSuit reverse proxy + load balancer (single entrypoint: port 80).
#
#   /api/*  -> backend pool (rate-limited)
#   /*      -> frontend (Next.js)
#
# Scale the API horizontally with:
#   docker compose up --scale backend=3 -d
# Docker's DNS returns every replica for the `backend` hostname, so nginx
# spreads requests across them. Unhealthy instances are retried past
# (max_fails) and the pool keeps serving.
#
# NOTE: plain static file on purpose — no envsubst templating, so nginx's own
# $variables are never mangled. Edit and `docker compose restart nginx` to change.

upstream backend {
    server backend:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream frontend {
    server frontend:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Per-IP API rate limit: 30 req/s sustained, bursts up to 60.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    # File uploads (gym logos etc.)
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------- API ----------
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Next.js hashed static assets are immutable: cache them a year.
    location /_next/static/ {
        proxy_pass http://frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------- Web app ----------
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
    }
}

